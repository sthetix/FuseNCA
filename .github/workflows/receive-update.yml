name: Receive Firmware Update

on:
  repository_dispatch:
    types: [firmware_update]

jobs:
  update-fusenca:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update FuseNCA data (fuses.json + README.md)
        run: python .github/scripts/update_fusenca.py
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_NCA_FAT: ${{ github.event.client_payload.nca_fat }}
          PAYLOAD_NCA_EXFAT: ${{ github.event.client_payload.nca_exfat }}

      - name: Commit and push changes
        run: |
          if [ -f ".github/has_changes" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add fuses.json README.md
            git commit -m "Auto-update: Firmware ${{ github.event.client_payload.version }} from AutoFW"
            git push
          fi
